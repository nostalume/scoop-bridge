name: Mirror to Codeberg

on:
    push:
        branches:
            - "main"
    # Auto Update pushes with the default GITHUB_TOKEN, and such a push does not
    # start this workflow, so mirror from the workflow that performed the pushes.
    workflow_run:
        workflows:
            - "Auto Update"
        types:
            - completed
    # Without a scheduled attempt a failed mirror stays invisible until a human push.
    schedule:
        - cron: "0 */12 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: mirror-codeberg
    cancel-in-progress: false

jobs:
    mirror:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: >-
            github.event_name != 'workflow_run' ||
            github.event.workflow_run.conclusion == 'success'
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Mirror repository
              shell: bash
              env:
                  CODEBERG_SSH_KEY: ${{ secrets.CODEBERG }}
                  # Pinned Codeberg host identity, SHA256:mIlxA9k46MmM6qdJOdMnAQpzGxF4WIVVL+fj+wZbw0g.
                  # Replace this single line when Codeberg announces a host key rotation.
                  CODEBERG_HOST_KEY: 'codeberg.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVIC02vnjFyL+I4RHfvIGNtOgJMe769VTF1VR4EB3ZB'
              run: |
                  set -euo pipefail
                  ssh_directory="$RUNNER_TEMP/scoop-bridge-ssh"
                  trap 'rm -rf "$ssh_directory"' EXIT
                  install -m 700 -d "$ssh_directory"
                  printf '%s\n' "$CODEBERG_SSH_KEY" | tr -d '\r' > "$ssh_directory/id_rsa"
                  chmod 600 "$ssh_directory/id_rsa"

                  printf '%s\n' "$CODEBERG_HOST_KEY" > "$ssh_directory/known_hosts"
                  export GIT_SSH_COMMAND="ssh -i $ssh_directory/id_rsa -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_directory/known_hosts -o StrictHostKeyChecking=yes"
                  git remote add codeberg-mirror git@codeberg.org:nostalgia/scoop-bridge.git
                  git push --force --prune codeberg-mirror \
                      'refs/remotes/origin/*:refs/heads/*' \
                      'refs/tags/*:refs/tags/*'
