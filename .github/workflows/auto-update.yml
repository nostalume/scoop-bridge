name: Auto Update

on:
    workflow_dispatch:
    schedule:
        - cron: "0 */4 * * *"

permissions:
    contents: write

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    auto-update:
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 2

            - name: Install test dependency
              shell: pwsh
              run: Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force

            - name: Run tests
              shell: pwsh
              run: .\tests\Run-Tests.ps1

            - name: Aggregate buckets
              shell: pwsh
              run: .\bin\auto-update.ps1

            - name: Commit generated output
              shell: pwsh
              run: |
                  git config user.email "github-actions@github.com"
                  git config user.name "github-actions[bot]"
                  git add -- bucket scripts
                  git diff --cached --quiet

                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "No generated changes to commit."
                      exit 0
                  }

                  if ($LASTEXITCODE -ne 1) {
                      throw "Unable to inspect the staged changes."
                  }

                  git commit -m "Updated on $(Get-Date -Format 'yyyy-MM-dd HH:mm K')"
                  if ($LASTEXITCODE -ne 0) {
                      throw "Unable to commit the generated output."
                  }

                  git push origin main
                  if ($LASTEXITCODE -ne 0) {
                      throw "Unable to push the generated output."
                  }
