name: Verify

on:
    push:
        branches:
            - "main"
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                shell:
                    - powershell
                    - pwsh
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install test dependency
              shell: ${{ matrix.shell }}
              run: Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force

            - name: Run tests
              shell: ${{ matrix.shell }}
              run: .\tests\Run-Tests.ps1
