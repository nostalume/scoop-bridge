name: Verify

on:
    push:
        branches:
            - "main"
    pull_request:

permissions:
    contents: read

jobs:
    windows-powershell:
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install test dependency
              shell: powershell
              run: Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force

            - name: Run tests
              shell: powershell
              run: .\tests\Run-Tests.ps1

    powershell:
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install test dependency
              shell: pwsh
              run: Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force

            - name: Run tests
              shell: pwsh
              run: .\tests\Run-Tests.ps1
